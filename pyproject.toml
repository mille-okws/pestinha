[project]
name = "pestinha"
version = "0.8.0"
description = "Pestinha: pets de tela para Windows, macOS e Linux, cada um com uma rede neural pulsada."
requires-python = ">=3.11"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "macos_real: abre janelas de verdade no macOS (pule com -m \"not macos_real\")",
]
